<h1>Reglas para pegar — solo PeloteAR</h1><p>Las demás apps no necesitan cambios.</p><section class="c"><h2>PeloteAR</h2><p>Proyecto: <b>pelotear-1f37e</b></p>

<p class="s">3) En Firebase: tocá dentro del cuadro de reglas, <b>Ctrl+A</b> (seleccionar todo), <b>pegar</b>, y botón azul <b>Publicar</b>.</p>
<textarea id="t0" readonly>rules_version = &#x27;2&#x27;;
// PeloteAR — Reglas Firestore (v2: datos propios de cada dueño en Firestore).
// Publicar en Firebase Console → proyecto pelotear-1f37e → Firestore Database → Reglas → pegar TODO → Publicar.
// Estas reglas NO borran ni modifican datos: solo controlan quién puede leer/escribir.
service cloud.firestore {
  match /databases/{database}/documents {

    function logueado() { return request.auth != null; }
    function esDueno(uid) { return logueado() &amp;&amp; request.auth.uid == uid; }
    function esAdmin() {
      return logueado()
        &amp;&amp; request.auth.token.email == &#x27;rgaraventa@gmail.com&#x27;
        &amp;&amp; request.auth.token.email_verified == true;
    }

    // Registro de usuarios: cada dueño escribe solo el suyo; el fin de la prueba gratis (demoHasta)
    // solo puede fijarlo una vez (máx. 15 días). El admin lee todos y lo cambia.
    match /usuarios/{uid} {
      allow read: if esAdmin() || esDueno(uid);
      allow create: if esDueno(uid)
        &amp;&amp; request.resource.data.keys().hasOnly([&#x27;email&#x27;,&#x27;nombre&#x27;,&#x27;alta&#x27;,&#x27;ultimoAcceso&#x27;,&#x27;app&#x27;,&#x27;demoHasta&#x27;])
        &amp;&amp; (!(&#x27;demoHasta&#x27; in request.resource.data) || request.resource.data.demoHasta &lt;= request.time + duration.value(15, &#x27;d&#x27;));
      allow update: if esAdmin()
        || (esDueno(uid)
            &amp;&amp; request.resource.data.keys().hasOnly([&#x27;email&#x27;,&#x27;nombre&#x27;,&#x27;alta&#x27;,&#x27;ultimoAcceso&#x27;,&#x27;app&#x27;,&#x27;demoHasta&#x27;])
            &amp;&amp; (request.resource.data.get(&#x27;demoHasta&#x27;, null) == resource.data.get(&#x27;demoHasta&#x27;, null)
                || (!(&#x27;demoHasta&#x27; in resource.data) &amp;&amp; request.resource.data.demoHasta &lt;= request.time + duration.value(15, &#x27;d&#x27;))));
      allow delete: if esAdmin();

      // Datos del complejo (config, productos, reservas, ventas, cierres, backups): solo el dueño.
      match /{sub=**} {
        allow read, write: if esDueno(uid);
      }
    }

    // Registro de errores: cualquier usuario logueado escribe, solo el admin lee
    match /errores/{id} {
      allow create: if logueado();
      allow read, delete: if esAdmin();
    }

    // Todo lo demás: cerrado
    match /{path=**} { allow read, write: if false; }
  }
}
