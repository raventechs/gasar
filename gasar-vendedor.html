<!--
  GasAR · APP DEL VENDEDOR
  Versión: 1.3.0-etapa4
  Fecha: 2026-10-02
  Changelog:
   - 1.3.0-etapa4: GASTO (combustible, mantenimiento, etc. descontado de la caja) y RETIRAR PLATA
     (retiro del dueño, depósito bancario) con motivo; ambos entran al efectivo esperado del cierre y de la rendición.
   - 1.2.0-etapa3: punto de venta revendedores, cuenta corriente, cobros, devolución de envases, comprobantes.
   - 1.1.0-etapa2: cargar camioneta, recibir carga, rendición ciega.
   - 1.0.0-etapa1: núcleo. Login, venta rápida, stock propio por tamaño/marca, caja, ventas del día + repetir, offline.
  PENDIENTE:
   - Precios especiales por revendedor
   - Devolución de envases de otra marca que la adeudada (hoy se acredita la misma marca)
   - Camioneta que se queda cargada de un día para el otro (hoy la rendición devuelve todo a la central)
   - Comprobante fiscal con ARCA (hoy: comprobante interno no fiscal)
   - Completar FB (config de Firebase) antes de desplegar
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A57C8">
<title>GasAR · Vendedor</title>
<link rel="manifest" href="manifest-gasar-vendedor.webmanifest">
<link rel="icon" href="icon-gasar-192.png">
<link rel="apple-touch-icon" href="icon-gasar-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECF0;--card:#fff;--ink:#101A24;--mut:#55677A;--line:#C9D2DB;--pri:#0A57C8;--pri-ink:#fff;--ok:#0E8A4F;--warn:#B8470C;--bad:#B42318;--chip:#DCE4EC;--r:14px}
[data-theme=dark]{--bg:#0D141B;--card:#152029;--ink:#E8EEF3;--mut:#8FA2B3;--line:#263544;--pri:#4C9BFF;--pri-ink:#06121F;--ok:#3DD68C;--warn:#FF9A5C;--bad:#FF6B5E;--chip:#1D2B38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:17px}
h1,h2,h3,.num{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#splash{position:fixed;inset:0;background:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;z-index:99;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
.gar{width:54px;height:92px;border:4px solid #fff;border-radius:16px;position:relative;overflow:hidden}
.gar:before{content:"";position:absolute;left:0;right:0;bottom:0;background:#fff;animation:fill 1.6s ease-in-out infinite alternate}
@keyframes fill{from{height:12%}to{height:88%}}
@media (prefers-reduced-motion:reduce){.gar:before{animation:none;height:60%}}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
header .logo{font-family:'Barlow Semi Condensed';font-weight:700;font-size:22px;color:var(--pri);user-select:none}
header .who{flex:1;min-width:0;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{background:var(--chip);border:0;border-radius:10px;min-width:44px;height:44px;font-size:18px}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--chip)}
.badge.ok{color:var(--ok)}.badge.off{color:var(--warn)}
main{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 150px);max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:22px;margin-bottom:8px}
.lbl{font-weight:600;margin:14px 0 8px;font-size:16px}
.btn{width:100%;min-height:64px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);font-weight:600;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px 12px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sel{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.btn small{display:block;font-weight:500;font-size:14px;opacity:.85}
.btn:disabled{opacity:.45}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.big{min-height:84px;font-size:26px;font-family:'Barlow Semi Condensed';flex-direction:column;gap:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--chip);border-radius:99px;padding:10px 16px;font-weight:600;min-height:46px}
.chip.sel{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:72px;height:64px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);font-size:30px;font-weight:700}
.step .n{flex:1;text-align:center;font-size:40px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.mut{color:var(--mut)}.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}
.note{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--chip);margin-top:8px}
.note.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:30}
.bar .in{max-width:560px;margin:0 auto}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tot .num{font-size:34px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;min-height:56px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px;padding:8px 14px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}#toast.err{background:var(--bad);color:#fff}
#pwa{display:none;position:fixed;left:12px;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;z-index:50;gap:10px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip)}
.tag.bad{color:var(--bad)}.tag.w{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="gar"></div><h1>GasAR</h1></div>
<div id="toast"></div>
<div id="root"></div>
<div id="pwa"><div style="flex:1">Instalá GasAR en tu celular para abrirla más rápido.</div><button class="chip sel" id="pwaYes">Instalar</button><button class="chip" id="pwaNo">Ahora no</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const VERSION='1.3.0-etapa4';
const FB={apiKey:'COMPLETAR',authDomain:'COMPLETAR',projectId:'COMPLETAR',storageBucket:'',messagingSenderId:'',appId:''};
const ADMIN_PIN='2580';

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$ '+Math.round(Number(n)||0).toLocaleString('es-AR');
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hora=t=>{const d=t&&t.toDate?t.toDate():new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const nid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const LS={get(k,d){try{const v=localStorage.getItem('gasar_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gasar_'+k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600)}
const SIN='_sin';

/* ---------- estado ---------- */
const S={user:null,perfil:null,tid:null,ubi:null,productos:[],marcas:[],saldos:{},turno:null,movCaja:[],ventas:[],pend:0,screen:'home',cart:[],pago:LS.get('pago',null),d:null,busy:false,tmp:{},cargasIn:[],camionetas:[],cargasOut:[],cg:null,rc:null,rend:{},saldoRows:[],centralOn:false,gx:null,rt:null,revOn:false,revs:[],ctaSaldos:{},ctaEnv:{},rv:null,cb:null,re:null,comp:null,unsub:[],online:navigator.onLine};
const newDraft=()=>({prodId:null,marcaId:null,cant:1,entrega:null,vac:1,marcaVac:null});
S.d=newDraft();

/* ---------- firebase ---------- */
if(FB.apiKey==='COMPLETAR'){
  document.getElementById('splash').classList.add('off');
  document.getElementById('root').innerHTML='<main><div class="card"><h2>Falta la configuración</h2><p>Completá el bloque <b>FB</b> con los datos de tu proyecto de Firebase y volvé a subir el archivo.</p></div></main>';
  throw new Error('Firebase sin configurar');
}
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
const FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('persistencia',e.code));
const T=()=>db.collection('tenants').doc(S.tid);
const sk=(u,p,m,t)=>[u,p,m,t].join('__');

function cleanup(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[];S.productos=[];S.marcas=[];S.saldos={};S.saldoRows=[];S.turno=null;S.movCaja=[];S.ventas=[];S.cargasIn=[];S.camionetas=[];S.cargasOut=[];S.centralOn=false;S.cg=null;S.rc=null;S.rend={};S.revOn=false;S.revs=[];S.ctaSaldos={};S.ctaEnv={};S.rv=null;S.cb=null;S.re=null;S.comp=null}

auth.onAuthStateChanged(async u=>{
  cleanup();S.user=u;S.perfil=null;
  if(!u){showSplash(false);return render()}
  try{
    const ref=db.collection('usuarios').doc(u.uid);
    let snap=null;try{snap=await ref.get({source:'cache'})}catch(e){}
    if(!snap||!snap.exists)snap=await ref.get();
    if(!snap.exists||snap.data().activo!==true){await auth.signOut();showSplash(false);return toast('Tu usuario no está habilitado. Pedile acceso al administrador.',true)}
    const p=snap.data();
    if(!p.ubicacionId){await auth.signOut();showSplash(false);return toast('Este usuario es de administración. Usá el panel.',true)}
    S.perfil=p;S.tid=p.tenantId;S.ubi=p.ubicacionId;S.screen='home';listen();
  }catch(e){console.error(e);await auth.signOut().catch(()=>{});toast('No se pudo iniciar sesión ('+(e.code||'error')+')',true)}
  showSplash(false);if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();render();
});

function listen(){
  const t=T(),u=S.ubi;
  S.unsub.push(t.collection('productos').where('activo','==',true).onSnapshot(s=>{S.productos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orden||a.kg||0)-(b.orden||b.kg||0));render()}));
  S.unsub.push(t.collection('marcas').where('activa','==',true).onSnapshot(s=>{S.marcas=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nombre.localeCompare(b.nombre));render()}));
  S.unsub.push(t.collection('ubicaciones').doc(u).onSnapshot(s=>{S.ubiDoc=s.exists?s.data():null;if(S.ubiDoc&&S.ubiDoc.tipo==='central'&&!S.centralOn){S.centralOn=true;listenCentral()}if(S.ubiDoc&&S.ubiDoc.tipo==='revendedores'&&!S.revOn){S.revOn=true;listenRev()}render()}));
  S.unsub.push(t.collection('cargas').where('destinoId','==',u).where('estado','==','en_transito').onSnapshot(s=>{S.cargasIn=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(a.ts)-tms(b.ts));render()}));
  S.unsub.push(t.collection('saldosStock').where('ubicacionId','==',u).onSnapshot(s=>{const m={},rows=[];s.docs.forEach(d=>{const x=d.data();m[sk(u,x.productoId,x.marcaId,x.tipo)]=x.cantidad||0;rows.push({p:x.productoId,m:x.marcaId})});S.saldos=m;S.saldoRows=rows;render()}));
  S.unsub.push(t.collection('turnosCaja').where('ubicacionId','==',u).where('estado','==','abierta').onSnapshot(s=>{
    const prev=S.turno&&S.turno.id;S.turno=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
    if((S.turno&&S.turno.id)!==prev)listenCaja();render()}));
  S.unsub.push(t.collection('ventas').where('ubicacionId','==',u).where('dia','==',hoy()).onSnapshot({includeMetadataChanges:true},s=>{
    S.ventas=s.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data()})).sort((a,b)=>tms(b.ts)-tms(a.ts));
    S.pend=S.ventas.filter(v=>v.pending).length;render()}));
}
function listenCentral(){
  const t=T(),u=S.ubi;
  S.unsub.push(t.collection('ubicaciones').where('tipo','==','camioneta').onSnapshot(s=>{S.camionetas=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.activa!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));render()}));
  S.unsub.push(t.collection('cargas').where('origenId','==',u).where('estado','==','en_transito').onSnapshot(s=>{S.cargasOut=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
}
function listenRev(){
  const t=T();
  S.unsub.push(t.collection('revendedores').where('activo','==',true).onSnapshot(s=>{S.revs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nombre.localeCompare(b.nombre));render()}));
  S.unsub.push(t.collection('ctaSaldos').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data().saldo||0);S.ctaSaldos=m;render()}));
  S.unsub.push(t.collection('ctaEnvases').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x.cantidad)(m[x.revendedorId]=m[x.revendedorId]||[]).push({p:x.productoId,m:x.marcaId,c:x.cantidad})});S.ctaEnv=m;render()}));
}
let unCaja=null;
function listenCaja(){
  if(unCaja){unCaja();unCaja=null}S.movCaja=[];
  if(!S.turno)return;
  unCaja=T().collection('movimientosCaja').where('turnoId','==',S.turno.id).onSnapshot(s=>{S.movCaja=s.docs.map(d=>d.data());render()});
  S.unsub.push(()=>{if(unCaja){unCaja();unCaja=null}});
}
const tms=t=>t&&t.toMillis?t.toMillis():(t?+new Date(t):0);

/* ---------- helpers de negocio ---------- */
const marcasLista=()=>S.marcas.length?S.marcas:[{id:SIN,nombre:'Sin marca'}];
const marcaNom=id=>id===SIN?'Sin marca':((S.marcas.find(m=>m.id===id)||{}).nombre||'Marca');
const prod=id=>S.productos.find(p=>p.id===id);
const saldo=(p,m,t)=>S.saldos[sk(S.ubi,p,m,t)]||0;
function marcaDefault(pid){
  const rec=LS.get('marca_'+pid,null);const L=marcasLista();
  if(rec&&L.some(m=>m.id===rec))return rec;
  return L.slice().sort((a,b)=>saldo(pid,b.id,'lleno')-saldo(pid,a.id,'lleno'))[0].id;
}
function buildItem(d){
  const p=prod(d.prodId);const vac=d.entrega===false?0:Math.min(d.vac,d.cant);
  const sinEnv=d.cant-vac;
  return{productoId:p.id,nombre:p.nombre,kg:p.kg,marcaId:d.marcaId,marcaNombre:marcaNom(d.marcaId),cant:d.cant,precio:p.precio||0,
    vacios:vac,marcaVacioId:vac?d.marcaVac||d.marcaId:null,marcaVacioNombre:vac?marcaNom(d.marcaVac||d.marcaId):null,
    sinEnvase:sinEnv,precioEnvase:p.precioEnvase||0,subtotal:d.cant*(p.precio||0)+sinEnv*(p.precioEnvase||0)};
}
const draftListo=()=>S.d.prodId&&S.d.entrega!==null;
function itemsActuales(){const it=S.cart.slice();if(draftListo())it.push(buildItem(S.d));return it}
const totalDe=it=>it.reduce((a,i)=>a+i.subtotal,0);

/* ---------- acciones ---------- */
function pickProd(id){S.d={...newDraft(),prodId:id,marcaId:marcaDefault(id)};S.d.marcaVac=S.d.marcaId;render()}
function agregarOtro(){if(!draftListo())return toast('Completá el producto primero',true);S.cart.push(buildItem(S.d));S.d=newDraft();render();window.scrollTo(0,0)}
function repetir(id){
  const v=S.ventas.find(x=>x.id===id);if(!v)return;
  S.cart=v.items.map(i=>{const p=prod(i.productoId);if(!p)return null;
    return{...i,nombre:p.nombre,precio:p.precio||0,precioEnvase:p.precioEnvase||0,subtotal:i.cant*(p.precio||0)+i.sinEnvase*(p.precioEnvase||0)}}).filter(Boolean);
  S.pago=v.medio;S.d=newDraft();S.screen='venta';render();toast('Venta cargada. Revisá y confirmá.');
}
function confirmar(){
  if(S.busy)return;
  const items=itemsActuales();
  if(!items.length)return toast('Elegí un producto',true);
  if(S.d.prodId&&S.d.entrega===null)return toast('Falta: ¿entrega envase vacío?',true);
  if(!S.pago)return toast('Elegí cómo paga',true);
  if(!S.turno)return toast('Primero abrí la caja',true);
  S.busy=true;setTimeout(()=>S.busy=false,900);
  const id=nid(),ts=TS.now(),dia=hoy(),t=T(),b=db.batch();
  const base={ubicacionId:S.ubi,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia};
  // diferencias de stock (venta permitida igual)
  const usado={};let dif=false;
  items.forEach(i=>{const k=i.productoId+'|'+i.marcaId;usado[k]=(usado[k]||0)+i.cant;i.sinStock=usado[k]>saldo(i.productoId,i.marcaId,'lleno');if(i.sinStock)dif=true});
  const total=totalDe(items);
  b.set(t.collection('ventas').doc(id),{...base,ubicacionNombre:(S.ubiDoc||{}).nombre||'',turnoId:S.turno.id,items,total,medio:S.pago,estado:'ok',conDiferencia:dif,origen:'vendedor',appVersion:VERSION,tsServer:FV.serverTimestamp()});
  items.forEach(i=>{
    mov(b,t,base,S.ubi,'lleno',i.productoId,i.marcaId,-i.cant,'venta','venta',id);
    if(i.vacios)mov(b,t,base,S.ubi,'vacio',i.productoId,i.marcaVacioId,i.vacios,'venta','venta',id);
  });
  b.set(t.collection('movimientosCaja').doc(nid()),{...base,turnoId:S.turno.id,tipo:'venta',medio:S.pago,importe:total,refId:id});
  b.commit().catch(e=>{console.error(e);toast('No se pudo guardar la venta ('+(e.code||'error')+')',true)});
  LS.set('pago',S.pago);items.forEach(i=>{LS.set('marca_'+i.productoId,i.marcaId)});
  S.cart=[];S.d=newDraft();render();window.scrollTo(0,0);
  toast('✓ Venta guardada '+money(total)+(dif?' · con diferencia de stock':''));
}
function mov(b,t,base,ubi,tipo,pid,mid,cant,motivo,refTipo,refId){
  b.set(t.collection('movimientosStock').doc(nid()),{...base,ubicacionId:ubi,tipo,productoId:pid,marcaId:mid,cantidad:cant,motivo,refTipo,refId});
  b.set(t.collection('saldosStock').doc(sk(ubi,pid,mid,tipo)),{ubicacionId:ubi,productoId:pid,marcaId:mid,tipo,cantidad:FV.increment(cant)},{merge:true});
}
async function abrirCaja(){
  if(S.turno)return;
  const f=parseFloat(S.tmp.fondo);if(isNaN(f)||f<0)return toast('Poné el fondo inicial (0 si no hay)',true);
  const id=nid();
  const b=db.batch();
  b.set(T().collection('turnosCaja').doc(id),{ubicacionId:S.ubi,ubicacionNombre:(S.ubiDoc||{}).nombre||'',estado:'abierta',fondoInicial:f,abiertaTs:TS.now(),dia:hoy(),uid:S.user.uid,abiertaPor:S.perfil.nombre});

  const g=S.rt;if(!g)return;const m=parseFloat(g.monto);
  if(!g.mot)return toast('Elegí el motivo',true);if(isNaN(m)||m<=0)return toast('Poné cuánta plata retirás',true);if(!S.turno)return toast('Primero abrí la caja',true);
  if(g.mot==='Otro'&&!(g.nota||'').trim())return toast('En "Otro" escribí el motivo',true);
  if(m>efectivoEsperado()&&!confirm('En la caja figuran '+money(efectivoEsperado())+' y querés retirar '+money(m)+'. ¿Registrar igual?'))return;
  if(S.busy)return;S.busy=true;setTimeout(()=>S.busy=false,900);
  const id=nid(),ts=TS.now(),dia=hoy(),t=T(),b=db.batch(),base={ubicacionId:S.ubi,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia};
  b.set(t.collection('movimientosCaja').doc(id),{...base,turnoId:S.turno.id,tipo:'retiro',medio:'efectivo',importe:-m,motivo:g.mot,nota:(g.nota||'').trim()});
  aud(b,'retiro_caja',g.mot+' '+m+((g.nota||'').trim()?' · '+g.nota.trim():''));
  b.commit().catch(e=>toast('No se pudo guardar el retiro ('+(e.code||'error')+')',true));
  S.rt=null;S.screen='home';render();toast('✓ Retiro registrado '+money(m));
}

  h+=`<div class="lbl">¿Cómo paga?</div><div class="grid g2">${[['efectivo','EFECTIVO'],['transferencia','TRANSFERENCIA'],['qr','QR / MP'],['cuenta','CUENTA CORRIENTE']].map(([k,n])=>`<button class="btn ${r.medio===k?'sel':''}" data-a="rvmedio" data-v="${k}" style="font-size:16px">${n}</button>`).join('')}</div>`;
  if(r.medio&&r.medio!=='cuenta'&&items.length)h+=`<div class="lbl">¿Cuánto paga ahora? <span class="mut">(si paga menos, el resto va a cuenta)</span></div><input id="rv_pag" type="number" inputmode="decimal" placeholder="${Math.round(total)}" value="${esc(r.pagado==null?'':r.pagado)}">`;
  if(items.length&&r.medio)h+=`<div class="card" style="margin-top:12px"><div class="row"><span>Paga ahora</span><b>${money(pagado)}</b></div><div class="row"><span>A cuenta corriente</span><b class="${aCuenta?'warn':''}">${money(aCuenta)}</b></div></div>`;
  h+=`</main><div class="bar"><div class="in"><div class="tot"><span class="mut">TOTAL</span><span class="num">${money(total)}</span></div><button class="btn ok" data-a="rvok" ${items.length&&r.medio?'':'disabled'}>CONFIRMAR</button></div></div>`;
  return h;
}
function vCobrar(){
  if(!S.cb)S.cb={rev:null,monto:'',medio:null};
  const c=S.cb;
  if(!c.rev)return `<main>${volver()}<div class="card"><h2>¿Quién paga?</h2>${selRev('cbsel',x=>(S.ctaSaldos[x.id]||0)>0,'Ningún revendedor tiene deuda.')}</div></main>`;
  const rev=revDe(c.rev),sd=S.ctaSaldos[rev.id]||0;
  return `<main>${volver()}<div class="card"><div class="row" style="border:0"><span><b class="num" style="font-size:22px">${esc(rev.nombre)}</b><br><span class="mut">Debe ${money(sd)}</span></span><button class="chip" data-a="cbcambiar">Cambiar</button></div>
  <div class="lbl">¿Cuánto paga?</div><input id="cb_monto" type="number" inputmode="decimal" value="${esc(c.monto)}"><div style="height:8px"></div><button class="chip" data-a="cbtodo">Pagar todo (${money(sd)})</button>
  <div class="lbl">¿Cómo paga?</div><div class="grid g3">${[['efectivo','EFECTIVO'],['transferencia','TRANSFER.'],['qr','QR / MP']].map(([k,n])=>`<button class="btn ${c.medio===k?'sel':''}" data-a="cbmedio" data-v="${k}" style="font-size:16px">${n}</button>`).join('')}</div></div></main>
  <div class="bar"><div class="in"><button class="btn ok" data-a="cbok">COBRAR</button></div></div>`;
}
function vRecEnv(){
  if(!S.re)S.re={rev:null,q:{}};
  const c=S.re;
  if(!c.rev)return `<main>${volver()}<div class="card"><h2>¿Quién devuelve envases?</h2>${selRev('resel',x=>(S.ctaEnv[x.id]||[]).length>0,'Ningún revendedor debe envases.')}</div></main>`;
  const rev=revDe(c.rev),rows=S.ctaEnv[rev.id]||[];
  let h=`<main>${volver()}<div class="card"><div class="row" style="border:0"><b class="num" style="font-size:22px">${esc(rev.nombre)}</b><button class="chip" data-a="recambiar">Cambiar</button></div><p class="mut">Contá los envases que trae y marcá cuántos devuelve.</p>`;
  rows.forEach(x=>{const k=x.p+'|'+x.m,q=c.q[k]||0;
    h+=`<div class="lbl">${((prod(x.p)||{}).kg||'')} kg ${esc(marcaNom(x.m))} <span class="mut">(debe ${x.c})</span></div><div class="step"><button data-a="req" data-k="${esc(k)}" data-max="${x.c}" data-n="-1">−</button><div class="n num">${q}</div><button data-a="req" data-k="${esc(k)}" data-max="${x.c}" data-n="1">+</button></div>`});
  return h+`</div></main><div class="bar"><div class="in"><button class="btn ok" data-a="reok">CONFIRMAR DEVOLUCIÓN</button></div></div>`;
}
function vComp(){
  if(!S.comp)return `<main>${volver()}</main>`;
  return `<main><div class="card"><h2>✓ Listo</h2><pre style="white-space:pre-wrap;font-family:inherit;font-size:15px;margin:0">${esc(S.comp.texto)}</pre></div>
  <div class="grid"><button class="btn ok" data-a="compwa">ENVIAR POR WHATSAPP</button><button class="btn" data-a="compcopy">COPIAR COMPROBANTE</button><button class="btn pri" data-a="compfin">LISTO</button></div></main>`;
}
function vGasto(){
  if(!S.gx)S.gx={cat:null,monto:'',nota:''};const g=S.gx;
  return `<main>${volver()}<div class="card"><h2>Gasto</h2><p class="mut">Sale de la plata en efectivo de tu caja.</p>
  <div class="lbl">¿En qué gastaste?</div><div class="chips">${GX_CAT.map(c=>`<button class="chip ${g.cat===c?'sel':''}" data-a="gxcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="lbl">¿Cuánto?</div><input id="gx_monto" type="number" inputmode="decimal" value="${esc(g.monto)}">
  <div class="lbl">Nota ${g.cat==='Otros'?'(obligatoria)':'(opcional)'}</div><input id="gx_nota" type="text" value="${esc(g.nota)}"></div></main>
  <div class="bar"><div class="in"><button class="btn ok" data-a="gxok">GUARDAR GASTO</button></div></div>`;
}
function vRetiro(){
  if(!S.rt)S.rt={mot:null,monto:'',nota:''};const g=S.rt;
  return `<main>${volver()}<div class="card"><h2>Retirar plata de la caja</h2><p class="mut">Hay en efectivo: <b>${money(S.turno?efectivoEsperado():0)}</b></p>
  <div class="lbl">Motivo</div><div class="chips">${RT_MOT.map(c=>`<button class="chip ${g.mot===c?'sel':''}" data-a="rtmot" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="lbl">¿Cuánto retirás?</div><input id="rt_monto" type="number" inputmode="decimal" value="${esc(g.monto)}">
  <div class="lbl">Nota ${g.mot==='Otro'?'(obligatoria)':'(opcional)'}</div><input id="rt_nota" type="text" value="${esc(g.nota)}"></div></main>
  <div class="bar"><div class="in"><button class="btn ok" data-a="rtok">CONFIRMAR RETIRO</button></div></div>`;
}
function render(){
  const r=$('#root');if(!r)return;
  const act=document.activeElement;if(act&&(act.id==='fondo'||act.id==='contado'||act.id==='em'||act.id==='pw'||act.id==='rend_efe'||act.id==='rv_pag'||act.id==='gx_monto'||act.id==='gx_nota'||act.id==='rt_monto'||act.id==='rt_nota'||act.id==='cb_monto'||(act.classList&&act.classList.contains('rin'))))return;
  if(!S.user||!S.perfil){r.innerHTML=vLogin();return}
  const v={home:vHome,venta:vVenta,stock:vStock,ventas:vVentas,caja:vCaja,cargar:vCargar,recibir:vRecibir,rendir:vRendir,revventa:vRevVenta,cobrar:vCobrar,recenv:vRecEnv,comp:vComp,gasto:vGasto,retiro:vRetiro}[S.screen]||vHome;
  const y=window.scrollY;r.innerHTML=head()+v();window.scrollTo(0,y);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,D=el.dataset;
  const A={
    login,salir:()=>auth.signOut(),
    tema:()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;LS.set('tema',n)},
    go:()=>{S.screen=D.v;if(D.v==='venta'){S.d=newDraft()}if(D.v==='cargar')cgInit();if(D.v==='recibir')S.rc=null;if(D.v==='revventa')rvInit();if(D.v==='gasto')S.gx=null;if(D.v==='retiro')S.rt=null;if(D.v==='cobrar')S.cb=null;if(D.v==='recenv')S.re=null;render();window.scrollTo(0,0)},
    prod:()=>pickProd(D.id),
    marca:()=>{S.d.marcaId=D.id;if(S.d.entrega!==true)S.d.marcaVac=D.id;render()},
    marcavac:()=>{S.d.marcaVac=D.id;render()},
    cant:()=>{S.d.cant=Math.max(1,S.d.cant+Number(D.n));if(S.d.entrega===true)S.d.vac=Math.min(S.d.cant,Math.max(1,S.d.vac));render()},
    ent:()=>{S.d.entrega=D.v==='1';if(S.d.entrega){S.d.vac=S.d.cant;S.d.marcaVac=S.d.marcaVac||S.d.marcaId}render()},
    vac:()=>{S.d.vac=Math.min(S.d.cant,Math.max(1,S.d.vac+Number(D.n)));render()},
    otro:agregarOtro,quitar:()=>{S.cart.splice(Number(D.i),1);render()},
    pago:()=>{S.pago=D.v;render()},confirmar,repetir:()=>repetir(D.id),
    abrir:abrirCaja,cerrar:cerrarCaja,
    cgdest:()=>{S.cg.dest=D.id;render()},cgprod:()=>{S.cg.d={prodId:D.id,marcaId:marcaDefault(D.id),cant:1};render()},cgmarca:()=>{S.cg.d.marcaId=D.id;render()},
    cgcant:()=>{S.cg.d.cant=Math.max(1,S.cg.d.cant+Number(D.n));render()},cgadd:cgAdd,cgdel:()=>{S.cg.items.splice(Number(D.i),1);render()},cgok:cgConfirmar,
    gxcat:()=>{S.gx.cat=D.v;render()},gxok:gxConfirmar,rtmot:()=>{S.rt.mot=D.v;render()},rtok:rtConfirmar,
    rvsel:()=>{S.rv.rev=D.id;render()},rvcambiar:()=>{S.rv.rev=null;S.rv.cart=[];render()},rvprod:()=>{S.rv.d={prodId:D.id,marcaId:marcaDefault(D.id),cant:1,vac:null,marcaVac:null};render()},
    rvmarca:()=>{S.rv.d.marcaId=D.id;render()},rvmarcavac:()=>{S.rv.d.marcaVac=D.id;render()},
    rvcant:()=>{const d=S.rv.d;d.cant=Math.max(1,d.cant+Number(D.n));if(d.vac!=null)d.vac=Math.min(d.vac,d.cant);render()},
    rvvac:()=>{const d=S.rv.d,cur=d.vac==null?d.cant:d.vac;d.vac=Math.min(d.cant,Math.max(0,cur+Number(D.n)));render()},
    rvadd:rvAdd,rvdel:()=>{S.rv.cart.splice(Number(D.i),1);render()},rvmedio:()=>{S.rv.medio=D.v;S.rv.pagado=null;render()},rvok:rvConfirmar,
    cbsel:()=>{S.cb.rev=D.id;S.cb.monto=String(Math.max(0,S.ctaSaldos[D.id]||0));render()},cbcambiar:()=>{S.cb.rev=null;render()},cbtodo:()=>{S.cb.monto=String(Math.max(0,S.ctaSaldos[S.cb.rev]||0));render()},
    cbmedio:()=>{S.cb.medio=D.v;render()},cbok:cbConfirmar,
    resel:()=>{S.re.rev=D.id;S.re.q={};render()},recambiar:()=>{S.re.rev=null;render()},
    req:()=>{const k=D.k,cur=S.re.q[k]||0;S.re.q[k]=Math.min(Number(D.max),Math.max(0,cur+Number(D.n)));render()},reok:reConfirmar,
    compwa:compWa,compcopy:compCopiar,compfin:()=>{S.comp=null;S.screen='home';render()},
    rcq:()=>{S.rc.q[Number(D.i)]=Math.max(0,S.rc.q[Number(D.i)]+Number(D.n));render()},rcok:rcConfirmar,rendok:enviarRendicion
  };
  if(A[a])A[a]();
});
document.addEventListener('input',e=>{const x=e.target;if(x.id==='fondo')S.tmp.fondo=x.value;if(x.id==='contado')S.tmp.contado=x.value;if(x.id==='rend_efe')S.rend.efe=x.value;if(x.id==='gx_monto'&&S.gx)S.gx.monto=x.value;if(x.id==='gx_nota'&&S.gx)S.gx.nota=x.value;if(x.id==='rt_monto'&&S.rt)S.rt.monto=x.value;if(x.id==='rt_nota'&&S.rt)S.rt.nota=x.value;if(x.id==='rv_pag'&&S.rv)S.rv.pagado=x.value;if(x.id==='cb_monto'&&S.cb)S.cb.monto=x.value;if(x.classList&&x.classList.contains('rin'))S.rend[x.dataset.p+'|'+x.dataset.m+'|'+x.dataset.t]=x.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))login()});
window.addEventListener('online',()=>{S.online=true;render()});window.addEventListener('offline',()=>{S.online=false;render()});
// 5 toques en el logo → diagnóstico (PIN estándar)
let taps=0,tapT;document.addEventListener('click',e=>{if(!e.target.closest('#logo'))return;taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,3000);if(taps>=5){taps=0;if(prompt('PIN')===ADMIN_PIN)alert('GasAR vendedor '+VERSION+'\nUsuario: '+(S.user?S.user.uid:'-')+'\nNegocio: '+(S.tid||'-')+'\nPunto: '+(S.ubi||'-')+'\nEn línea: '+S.online+'\nVentas sin enviar: '+S.pend)}});
document.documentElement.dataset.theme=LS.get('tema','light');
// PWA
let dip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!LS.get('pwaNo',false))$('#pwa').style.display='flex'});
$('#pwaYes').onclick=async()=>{$('#pwa').style.display='none';if(dip){dip.prompt();dip=null}};$('#pwaNo').onclick=()=>{$('#pwa').style.display='none';LS.set('pwaNo',true)};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw-gasar-vendedor.js').catch(()=>{}));
setTimeout(()=>{if(!S.user)showSplash(false)},4000);
</script>
