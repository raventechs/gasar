<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A57C8">
<title>GasAR · Administración</title>
<link rel="manifest" href="manifest-gasar-admin.webmanifest">
<link rel="icon" href="icon-gasar-192.png">
<link rel="apple-touch-icon" href="icon-gasar-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECF0;--card:#fff;--ink:#101A24;--mut:#55677A;--line:#C9D2DB;--pri:#0A57C8;--pri-ink:#fff;--ok:#0E8A4F;--warn:#B8470C;--bad:#B42318;--chip:#DCE4EC;--r:12px}
[data-theme=dark]{--bg:#0D141B;--card:#152029;--ink:#E8EEF3;--mut:#8FA2B3;--line:#263544;--pri:#4C9BFF;--pri-ink:#06121F;--ok:#3DD68C;--warn:#FF9A5C;--bad:#FF6B5E;--chip:#1D2B38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px}
h1,h2,h3,.num{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-weight:700;margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#splash{position:fixed;inset:0;background:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;z-index:99;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
.gar{width:54px;height:92px;border:4px solid #fff;border-radius:16px;position:relative;overflow:hidden}
.gar:before{content:"";position:absolute;left:0;right:0;bottom:0;background:#fff;animation:fill 1.6s ease-in-out infinite alternate}
@keyframes fill{from{height:12%}to{height:88%}}
@media (prefers-reduced-motion:reduce){.gar:before{animation:none;height:60%}*{transition:none!important}}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0}
.top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.logo{font-family:'Barlow Semi Condensed';font-weight:700;font-size:22px;color:var(--pri);user-select:none}
.who{flex:1;min-width:0;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico,.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;min-height:40px;padding:6px 14px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:32px;padding:2px 10px;font-size:14px}
.btn:disabled{opacity:.5}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
nav button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:14px 14px 60px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:20px;margin-bottom:8px}
.kpi .num{font-size:36px;display:block}
.mut{color:var(--mut)}.bad{color:var(--bad)}.warn{color:var(--warn)}.okc{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600}td.r,th.r{text-align:right}
.alert{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:8px 12px;border-radius:8px;margin-bottom:8px}
.alert.b{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:block;font-size:14px;color:var(--mut);font-weight:600;margin-bottom:4px}
input,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 10px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip)}.tag.bad{color:var(--bad)}.tag.w{color:var(--warn)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}#toast.err{background:var(--bad);color:#fff}
.login{max-width:380px;margin:12vh auto 0;padding:0 14px}
</style>
</head>
<body>
<div id="splash"><div class="gar"></div><h1>GasAR</h1></div>
<div id="toast"></div>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const VERSION='1.3.1-etapa4';
const FB={apiKey:'AIzaSyCNPAaSEfy38EP0qycOKREvwAR3ke4Jlxc',authDomain:'gasar-ee15b.firebaseapp.com',projectId:'gasar-ee15b',storageBucket:'gasar-ee15b.firebasestorage.app',messagingSenderId:'836541879587',appId:'1:836541879587:web:7ffc02bf08c957179b6896'};
const RAVEN_EMAIL='rgaraventa@gmail.com',ADMIN_PIN='2580';

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$ '+Math.round(Number(n)||0).toLocaleString('es-AR');
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fh=t=>{if(!t)return'';const d=t.toDate?t.toDate():new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const tms=t=>t&&t.toMillis?t.toMillis():(t?+new Date(t):0);
const nid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const LS={get(k,d){try{const v=localStorage.getItem('gasar_a_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gasar_a_'+k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2800)}
const SIN='_sin';
const ROLES={administrador:'Administrador',administracion:'Administración',vendedor_central:'Vendedor central',vendedor_revendedores:'Vendedor revendedores',vendedor_camioneta:'Vendedor camioneta'};
const TIPOS={central:'Central',camioneta:'Camioneta',revendedores:'Revendedores'};

const S={user:null,perfil:null,tid:null,raven:false,tenant:null,tab:LS.get('tab','resumen'),fecha:hoy(),
  productos:[],marcas:[],ubis:[],saldos:[],turnos:[],cierres:[],ventas:[],usuarios:[],movs:[],audit:[],tenants:[],hist:'stock',cargas:[],rends:[],cgA:{items:[]},provs:[],provSaldos:{},provMov:[],compras:[],gastos:[],movCaja:[],cpA:{items:[],h:{}},provSel:null,revs:[],ctaSaldos:{},ctaEnvAll:[],ctaMov:[],revSel:null,unsub:[],online:navigator.onLine};

if(FB.apiKey==='COMPLETAR'){
  $('#splash').classList.add('off');
  $('#root').innerHTML='<main><div class="card"><h2>Falta la configuración</h2><p>Completá el bloque <b>FB</b> con los datos de tu proyecto de Firebase y volvé a subir el archivo.</p></div></main>';
  throw new Error('Firebase sin configurar');
}
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
const FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('persistencia',e.code));
const T=()=>db.collection('tenants').doc(S.tid);
const sk=(u,p,m,t)=>[u,p,m,t].join('__');
const soyRaven=u=>u&&u.email===RAVEN_EMAIL&&u.emailVerified;

function cleanup(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[]}
auth.onAuthStateChanged(async u=>{
  cleanup();S.user=u;S.perfil=null;S.tid=null;S.raven=false;
  if(!u){hideSplash();return render()}
  try{
    const ref=db.collection('usuarios').doc(u.uid);
    let snap=null;try{snap=await ref.get({source:'cache'})}catch(e){}
    if(!snap||!snap.exists)snap=await ref.get().catch(()=>null);
    if(snap&&snap.exists){
      const p=snap.data();
      if(p.activo!==true||!['administrador','administracion'].includes(p.rol)){await auth.signOut();hideSplash();return toast('Este usuario no tiene acceso al panel.',true)}
      S.perfil=p;S.tid=p.tenantId;listen();
    }else if(soyRaven(u)){
      S.raven=true;S.perfil={nombre:'Raven',rol:'administrador'};loadTenants();
    }else{await auth.signOut();hideSplash();return toast('Tu usuario no está habilitado.',true)}
  }catch(e){console.error(e);await auth.signOut().catch(()=>{});toast('No se pudo iniciar sesión ('+(e.code||'error')+')',true)}
  hideSplash();blur();render();
});
function blur(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function hideSplash(){$('#splash').classList.add('off')}

function loadTenants(){S.unsub.push(db.collection('tenants').onSnapshot(s=>{S.tenants=s.docs.map(d=>({id:d.id,...d.data()}));render()}))}
function entrarTenant(id){cleanup();S.tid=id;S.tab='resumen';listen();loadTenants();render()}
function salirTenant(){cleanup();S.tid=null;S.tenant=null;loadTenants();render()}

function listen(){
  const t=T(),mk=(q,k,f)=>S.unsub.push(q.onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(f)f();render()},e=>console.warn(k,e.code)));
  S.unsub.push(t.onSnapshot(s=>{S.tenant=s.exists?s.data():null;render()}));
  mk(t.collection('productos'),'productos',()=>S.productos.sort((a,b)=>(a.orden||a.kg||0)-(b.orden||b.kg||0)));
  mk(t.collection('marcas'),'marcas',()=>S.marcas.sort((a,b)=>a.nombre.localeCompare(b.nombre)));
  mk(t.collection('ubicaciones'),'ubis');
  mk(t.collection('saldosStock'),'saldos');
  mk(t.collection('turnosCaja').where('estado','==','abierta'),'turnos');
  mk(t.collection('turnosCaja').orderBy('abiertaTs','desc').limit(30),'cierres');
  mk(db.collection('usuarios').where('tenantId','==',S.tid),'usuarios');
  mk(t.collection('movimientosStock').orderBy('ts','desc').limit(100),'movs');
  mk(t.collection('auditoria').orderBy('ts','desc').limit(100),'audit');
  mk(t.collection('cargas').orderBy('ts','desc').limit(50),'cargas');
  mk(t.collection('rendiciones').orderBy('ts','desc').limit(50),'rends');
  mk(t.collection('revendedores'),'revs',()=>S.revs.sort((a,b)=>a.nombre.localeCompare(b.nombre)));
  mk(t.collection('ctaCte').orderBy('ts','desc').limit(500),'ctaMov');
  S.unsub.push(t.collection('ctaSaldos').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data().saldo||0);S.ctaSaldos=m;render()},e=>console.warn('ctaSaldos',e.code)));
  S.unsub.push(t.collection('ctaEnvases').onSnapshot(s=>{S.ctaEnvAll=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.cantidad);render()},e=>console.warn('ctaEnvases',e.code)));
  mk(t.collection('proveedores'),'provs',()=>S.provs.sort((a,b)=>a.nombre.localeCompare(b.nombre)));
  mk(t.collection('provCte').orderBy('ts','desc').limit(300),'provMov');
  mk(t.collection('compras').orderBy('ts','desc').limit(100),'compras');
  mk(t.collection('gastos').orderBy('ts','desc').limit(100),'gastos');
  mk(t.collection('movimientosCaja').orderBy('ts','desc').limit(500),'movCaja');
  S.unsub.push(t.collection('provSaldos').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data().saldo||0);S.provSaldos=m;render()},e=>console.warn('provSaldos',e.code)));
  subVentas();
}
let unV=null;
function subVentas(){
  if(unV){unV();unV=null}
  unV=T().collection('ventas').where('dia','==',S.fecha).onSnapshot(s=>{S.ventas=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b.ts)-tms(a.ts));render()},e=>console.warn('ventas',e.code));
  S.unsub.push(()=>{if(unV){unV();unV=null}});
}

/* ---------- helpers ---------- */
const prodN=id=>(S.productos.find(p=>p.id===id)||{}).nombre||'Producto';
const marcaN=id=>id===SIN?'Sin marca':((S.marcas.find(m=>m.id===id)||{}).nombre||'Marca');
const ubiN=id=>(S.ubis.find(u=>u.id===id)||{}).nombre||'Punto';
const central=()=>S.ubis.find(u=>u.tipo==='central');
const okVentas=()=>S.ventas.filter(v=>v.estado==='ok');
const audit=(b,accion,detalle)=>b.set(T().collection('auditoria').doc(nid()),{accion,detalle,uid:S.user.uid,usuario:S.perfil.nombre,ts:TS.now()});
function ajusteStock(b,ubi,pid,mid,tipo,cant,motivo,extra){
  b.set(T().collection('movimientosStock').doc(nid()),{ubicacionId:ubi,tipo,productoId:pid,marcaId:mid,cantidad:cant,motivo,uid:S.user.uid,usuario:S.perfil.nombre,ts:TS.now(),dia:hoy(),...(extra||{})});
  b.set(T().collection('saldosStock').doc(sk(ubi,pid,mid,tipo)),{ubicacionId:ubi,productoId:pid,marcaId:mid,tipo,cantidad:FV.increment(cant)},{merge:true});
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const num=id=>{const v=parseFloat(val(id));return isNaN(v)?null:v};
const commit=(b,ok,msg)=>b.commit().then(()=>ok&&toast(ok)).catch(e=>{console.error(e);toast((msg||'No se pudo guardar')+' ('+(e.code||'error')+')',true)});

/* ---------- acciones ---------- */
async function login(){
  const e=val('em'),p=document.getElementById('pw').value;if(!e||!p)return toast('Poné mail y clave',true);
  $('#splash').classList.remove('off');
  try{await auth.signInWithEmailAndPassword(e,p)}catch(x){hideSplash();toast('Mail o clave incorrectos',true)}
}
async function loginGoogle(){
  const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov)}
  catch(e){
    console.error('google',e);
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(prov);return}catch(x){e=x}}
    const msg={'auth/unauthorized-domain':'Falta autorizar el dominio raventechs.github.io en Firebase (Authentication → Configuración → Dominios autorizados)','auth/operation-not-allowed':'Falta habilitar Google en Firebase (Authentication → Sign-in method)','auth/popup-closed-by-user':'Cerraste la ventana de Google antes de terminar','auth/cancelled-popup-request':'Se canceló la ventana de Google, probá de nuevo','auth/network-request-failed':'Sin conexión, probá de nuevo'}[e.code];
    toast(msg||('No se pudo ingresar con Google ('+(e.code||'error')+')'),true);
    const d=document.getElementById('gerr');if(d)d.textContent=(msg||'Error')+' · '+(e.code||'')
  }
}

function guardarProducto(id){
  const b=db.batch(),r=T().collection('productos').doc(id);
  const d={precio:num('pr_'+id)??0,precioRevendedor:num('prv_'+id)??0,precioEnvase:num('pe_'+id)??0,stockMinimo:num('sm_'+id)??0};
  b.update(r,d);audit(b,'editar_producto',prodN(id)+' precio '+d.precio+' envase '+d.precioEnvase+' mín '+d.stockMinimo);commit(b,'Producto guardado');
}
function toggleProducto(id,act){const b=db.batch();b.update(T().collection('productos').doc(id),{activo:act});audit(b,act?'activar_producto':'desactivar_producto',prodN(id));commit(b,act?'Producto activado':'Producto desactivado')}
function nuevoProducto(){
  const n=val('np_n'),kg=num('np_kg');if(!n||!kg)return toast('Poné nombre y kilos',true);
  const id=nid(),b=db.batch();
  b.set(T().collection('productos').doc(id),{nombre:n,kg,precio:num('np_p')??0,precioRevendedor:num('np_r')??0,precioEnvase:num('np_e')??0,stockMinimo:num('np_m')??0,activo:true,orden:kg});
  audit(b,'crear_producto',n);commit(b,'Producto creado');
}
function nuevaMarca(){
  const n=val('nm_n');if(!n)return toast('Poné el nombre de la marca',true);
  if(S.marcas.some(m=>m.nombre.toLowerCase()===n.toLowerCase()))return toast('Esa marca ya existe',true);
  const b=db.batch();b.set(T().collection('marcas').doc(nid()),{nombre:n,activa:true});audit(b,'crear_marca',n);commit(b,'Marca creada');
}
function toggleMarca(id,act){const b=db.batch();b.update(T().collection('marcas').doc(id),{activa:act});audit(b,'marca_'+(act?'activar':'desactivar'),marcaN(id));commit(b,'Listo')}
function nuevaUbi(){
  const n=val('nu_n'),tp=val('nu_t');if(!n)return toast('Poné un nombre',true);
  if(tp==='central'&&central())return toast('Ya existe un punto central',true);
  if(tp==='camioneta'){const lim=(S.tenant||{}).limiteCamionetas;if(lim!=null&&S.ubis.filter(u=>u.tipo==='camioneta'&&u.activa!==false).length>=lim)return toast('Llegaste al límite de camionetas de tu plan ('+lim+')',true)}
  const b=db.batch();b.set(T().collection('ubicaciones').doc(nid()),{nombre:n,tipo:tp,activa:true,creadaTs:TS.now()});audit(b,'crear_punto',n+' ('+tp+')');commit(b,'Punto creado');
}
function toggleUbi(id,act){const b=db.batch();b.update(T().collection('ubicaciones').doc(id),{activa:act});audit(b,'punto_'+(act?'activar':'desactivar'),ubiN(id));commit(b,'Listo')}
function secApp(){return firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec')}
async function crearUsuarioAuth(email,pass,datos){
  const sec=secApp();
  const cred=await sec.auth().createUserWithEmailAndPassword(email,pass);
  try{await db.collection('usuarios').doc(cred.user.uid).set({...datos,email,activo:true,creadoTs:TS.now()})}
  finally{await sec.auth().signOut()}
  return cred.user.uid;
}
async function nuevoUsuario(){
  const email=val('nus_e'),pass=document.getElementById('nus_p').value,nombre=val('nus_n'),rol=val('nus_r'),ubi=val('nus_u');
  if(!email||!nombre||pass.length<6)return toast('Completá mail, nombre y una clave de 6+ caracteres',true);
  if(rol.startsWith('vendedor')&&!ubi)return toast('Elegí el punto de venta del vendedor',true);
  const lim=(S.tenant||{}).limiteUsuarios;if(lim!=null&&S.usuarios.filter(u=>u.activo).length>=lim)return toast('Llegaste al límite de usuarios de tu plan ('+lim+')',true);
  try{
    await crearUsuarioAuth(email,pass,{tenantId:S.tid,nombre,rol,ubicacionId:rol.startsWith('vendedor')?ubi:null});
    const b=db.batch();audit(b,'crear_usuario',nombre+' · '+rol);await b.commit();toast('Usuario creado');
  }catch(e){toast(e.code==='auth/email-already-in-use'?'Ese mail ya está registrado':'No se pudo crear ('+(e.code||'error')+')',true)}
}
function toggleUsuario(id,act){
  if(id===S.user.uid)return toast('No podés desactivarte a vos mismo',true);
  const b=db.batch();b.update(db.collection('usuarios').doc(id),{activo:act});audit(b,act?'activar_usuario':'desactivar_usuario',id);commit(b,'Listo');
}

function aprobarRendicion(id){
  const r=S.rends.find(x=>x.id===id);if(!r||r.estado!=='pendiente')return;
  const c=central();if(!c)return toast('No hay punto Central',true);
  const nd=r.lineas.filter(l=>l.dif).length,dE=r.efectivo.dif;
  if(!confirm('Aprobar la rendición de '+r.ubicacionNombre+'?\n\nSe devuelve a la central lo que contó el chofer'+(nd?' y se registran '+nd+' diferencia(s) de stock':'')+'.\nEfectivo declarado: '+money(r.efectivo.declarado)+' (diferencia '+money(dE)+')'))return;

  r.lineas.forEach(l=>{
    if(l.declarado>0){
      ajusteStock(b,r.ubicacionId,l.productoId,l.marcaId,l.tipo,-l.declarado,'rendicion',{refTipo:'rendicion',refId:id});
      ajusteStock(b,c.id,l.productoId,l.marcaId,l.tipo,l.declarado,'rendicion',{refTipo:'rendicion',refId:id});
    }
    if(l.dif)ajusteStock(b,r.ubicacionId,l.productoId,l.marcaId,l.tipo,l.dif,'diferencia_rendicion',{refTipo:'rendicion',refId:id});
  });

  if(tc&&r.efectivo.declarado)b.set(T().collection('movimientosCaja').doc(nid()),{turnoId:tc.id,ubicacionId:c.id,tipo:'rendicion',medio:'efectivo',importe:r.efectivo.declarado,refId:id,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia:hoy()});

}

const revN=id=>(S.revs.find(r=>r.id===id)||{}).nombre||'Revendedor';
function deudaInfo(id){
  const saldo=S.ctaSaldos[id]||0;let rest=saldo,venc=0,prox=null;
  if(rest<=0)return{saldo,venc:0,prox:null};
  const anul=new Set(S.ctaMov.filter(m=>m.tipo==='anulacion').map(m=>m.ventaId));
  const cr=S.ctaMov.filter(m=>m.revendedorId===id&&m.tipo==='venta'&&m.importe>0&&!anul.has(m.ventaId)).sort((a,b)=>tms(b.ts)-tms(a.ts));
  for(const m of cr){if(rest<=0)break;const part=Math.min(rest,m.importe);rest-=part;if(m.vencimiento&&m.vencimiento<hoy())venc+=part;else if(m.vencimiento&&(!prox||m.vencimiento<prox))prox=m.vencimiento}
  return{saldo,venc,prox};
}

const provN=id=>(S.provs.find(p=>p.id===id)||{}).nombre||'Proveedor';
const centralTurno=()=>{const c=central();return c?S.turnos.find(t=>t.ubicacionId===c.id):null};
function csv(nombre,filas){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const txt='\ufeff'+filas.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=nombre+'_'+hoy()+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const fcsv=t=>{if(!t)return'';const d=t.toDate?t.toDate():new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function exportar(k){

    ventas:()=>csv('ventas_'+S.fecha,[['Fecha','N°','Punto','Vendedor','Revendedor','Detalle','Medio','Total','Pagado','A cuenta','Estado']].concat(S.ventas.map(v=>[fcsv(v.ts),v.id.slice(0,4).toUpperCase(),v.ubicacionNombre||ubiN(v.ubicacionId),v.usuario,v.revendedorNombre||'',v.items.map(i=>i.cant+'x'+i.kg+'kg '+i.marcaNombre).join(' | '),v.medio,v.total,v.pagado??v.total,v.aCuenta??0,v.estado]))),

    compras:()=>csv('compras',[['Fecha','Proveedor','Comprobante','Detalle','Medio','Total','Pagado','A cuenta','Estado']].concat(S.compras.map(c=>[c.fecha||fcsv(c.ts),c.proveedorNombre,c.comprobante||'',c.items.map(i=>i.cant+'x'+i.kg+'kg '+i.marcaNombre+' a '+i.precio).join(' | '),c.medio,c.total,c.pagado,c.aProveedor,c.estado]))),
    gastos:()=>csv('gastos',[['Fecha','Punto','Categoría','Monto','Medio','Nota','Usuario','Estado']].concat(S.gastos.map(g=>[fcsv(g.ts),g.ubicacionNombre||ubiN(g.ubicacionId),g.categoria,g.monto,g.medio,g.nota||'',g.usuario,g.estado]))),
    revendedores:()=>csv('cuentas_corrientes',[['Revendedor','Teléfono','Debe','Vencido','Próx. vencimiento','Límite','Envases que debe']].concat(S.revs.map(r=>{const d=deudaInfo(r.id);return[r.nombre,r.telefono||'',d.saldo,d.venc,d.prox||'',r.limiteCredito||0,envRev(r.id).map(e=>e.cantidad+'x'+((S.productos.find(p=>p.id===e.productoId)||{}).kg||'')+'kg '+marcaN(e.marcaId)).join(' | ')]}))),
    proveedores:()=>csv('proveedores',[['Proveedor','Teléfono','Se le debe']].concat(S.provs.map(p=>[p.nombre,p.telefono||'',S.provSaldos[p.id]||0]))),
    historial:()=>csv('movimientos_stock',[['Fecha','Punto','Producto','Marca','Tipo','Cantidad','Motivo','Usuario']].concat(S.movs.map(m=>[fcsv(m.ts),ubiN(m.ubicacionId),prodN(m.productoId),marcaN(m.marcaId),m.tipo,m.cantidad,m.motivo,m.usuario])))
  };
  if(F[k])F[k]();

function pvPagar(id){
  const m=num('pp_m'),medio=val('pp_t');if(!m||m<=0)return toast('Poné el monto',true);
  const c=central(),tc=medio==='efectivo'?centralTurno():null;
  if(medio==='efectivo'&&!tc&&!confirm('No hay caja central abierta: el pago no se descuenta de ninguna caja. ¿Seguir?'))return;
  const sd=S.provSaldos[id]||0;if(m>sd&&!confirm('El pago ('+money(m)+') es mayor que lo que se le debe ('+money(sd)+'). ¿Seguir?'))return;

  b.set(T().collection('provSaldos').doc(id),{proveedorId:id,saldo:FV.increment(-m)},{merge:true});
  if(tc)b.set(T().collection('movimientosCaja').doc(nid()),{turnoId:tc.id,ubicacionId:c.id,tipo:'pago_proveedor',medio:'efectivo',importe:-m,refId:rid,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia});
  audit(b,'pago_proveedor',provN(id)+' '+m+' ('+medio+')');commit(b,'Pago registrado');
}
function gxCrear(){
  const ubi=val('gx_u'),cat=val('gx_c'),m=num('gx_m'),medio=val('gx_t'),nota=val('gx_n');
  if(!ubi||!m||m<=0)return toast('Elegí el punto y poné el monto',true);if(cat==='Otros'&&!nota)return toast('En "Otros" escribí una nota',true);
  const tc=medio==='efectivo'?S.turnos.find(t=>t.ubicacionId===ubi):null;
  if(medio==='efectivo'&&!tc&&!confirm('Ese punto no tiene la caja abierta: el gasto no se descuenta de ninguna caja. ¿Seguir?'))return;
  const id=nid(),b=db.batch(),ts=TS.now(),dia=hoy();
  b.set(T().collection('gastos').doc(id),{ubicacionId:ubi,ubicacionNombre:ubiN(ubi),turnoId:tc?tc.id:null,categoria:cat,monto:m,medio,nota,estado:'ok',uid:S.user.uid,usuario:S.perfil.nombre,ts,dia,origen:'panel',appVersion:VERSION});
  if(tc)b.set(T().collection('movimientosCaja').doc(nid()),{turnoId:tc.id,ubicacionId:ubi,tipo:'gasto',medio:'efectivo',importe:-m,refId:id,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia});
  audit(b,'gasto',ubiN(ubi)+' '+cat+' '+m+' ('+medio+')');commit(b,'Gasto registrado');
}
function gxAnular(id){
  const g=S.gastos.find(x=>x.id===id);if(!g||g.estado!=='ok')return;
  const mo=prompt('Motivo de la anulación (obligatorio):');if(!mo||!mo.trim())return toast('Falta el motivo',true);
  if(!confirm('Se anula el gasto de '+money(g.monto)+(g.turnoId?' y se devuelve a la caja':'')+'. ¿Confirmar?'))return;
  const b=db.batch(),ts=TS.now();
  b.update(T().collection('gastos').doc(id),{estado:'anulado',anuladoPor:S.perfil.nombre,anuladoTs:ts,anulacionMotivo:mo.trim()});
  if(g.turnoId&&g.medio==='efectivo')b.set(T().collection('movimientosCaja').doc(nid()),{turnoId:g.turnoId,ubicacionId:g.ubicacionId,tipo:'anulacion',medio:'efectivo',importe:g.monto,refId:id,uid:S.user.uid,usuario:S.perfil.nombre,ts,dia:hoy()});

  <div><label>Punto</label><select id="gx_u">${S.ubis.filter(u=>u.activa!==false).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select></div>
  <div><label>Categoría</label><select id="gx_c">${['Combustible','Mantenimiento','Sueldos','Alquiler','Servicios','Impuestos','Peaje / estacionamiento','Comida','Otros'].map(c=>`<option>${c}</option>`).join('')}</select></div>
  <div><label>Monto</label><input id="gx_m" type="number" inputmode="decimal"></div><div><label>Medio</label><select id="gx_t"><option value="efectivo">Efectivo (de la caja)</option><option value="transferencia">Transferencia</option></select></div>
  <div><label>Nota</label><input id="gx_n"></div><div><button class="btn pri" data-a="gxn">REGISTRAR</button></div></div></div>
  <div class="card tw"><h2>Gastos recientes <span class="mut" style="font-size:15px">· hoy ${money(hoyT)}</span></h2><table><tr><th>Fecha</th><th>Punto</th><th>Categoría</th><th class="r">Monto</th><th>Medio</th><th>Nota</th><th>Usuario</th><th></th></tr>
  ${S.gastos.map(g=>`<tr><td>${fh(g.ts)}</td><td>${esc(g.ubicacionNombre||ubiN(g.ubicacionId))}</td><td>${esc(g.categoria)}</td><td class="r"><b>${money(g.monto)}</b></td><td>${esc(g.medio)}</td><td style="white-space:normal">${esc(g.nota||'')}</td><td>${esc(g.usuario)}</td>
  <td>${g.estado==='ok'?`<button class="btn sm bad" data-a="gxx" data-id="${g.id}">Anular</button>`:'<span class="tag bad">ANULADO</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">Sin gastos.</td></tr>'}</table></div></main>`;
}
let lastFocus=null;
function render(){
  const r=$('#root');if(!r)return;
  const a=document.activeElement;if(a&&['INPUT','SELECT'].includes(a.tagName)&&r.contains(a))return; // no pisar lo que se está escribiendo
  if(!S.user||!S.perfil){r.innerHTML=vLogin();return}
  if(S.raven&&!S.tid){r.innerHTML=vRaven();return}
  const v={resumen:vResumen,stock:vStock,ventas:vVentas,cajas:vCajas,cargas:vCargas,rendiciones:vRendiciones,revendedores:vRevendedores,compras:vCompras,proveedores:vProveedores,gastos:vGastos,historial:vHistorial,ajustes:vAjustes,catalogo:vCatalogo,puntos:vPuntos,usuarios:vUsuarios}[S.tab]||vResumen;
  const y=window.scrollY;let body=v();if(['ventas','stock','compras','gastos','revendedores','proveedores','historial'].includes(S.tab))body=body.replace(/<\/main>\s*$/,`<div style="margin-top:6px"><button class="btn sm" data-a="csv" data-v="${S.tab}">⬇ Exportar CSV</button></div></main>`);r.innerHTML=head()+body;window.scrollTo(0,y);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const D=el.dataset;
  const A={login,google:loginGoogle,salir:()=>auth.signOut(),salirT:salirTenant,entrar:()=>entrarTenant(D.id),crearDist:crearDistribuidora,
    tema:()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;LS.set('tema',n)},
    tab:()=>{S.tab=D.v;LS.set('tab',D.v);render();window.scrollTo(0,0)},hist:()=>{S.hist=D.v;render()},
    anular:()=>anular(D.id),cgadd:cgAgregar,cgdel:()=>cgQuitar(Number(D.i)),cgok:cgCrear,cgcancel:()=>cgCancelar(D.id),cpadd:cpAgregar,cpdel:()=>cpQuitar(Number(D.i)),cpok:cpCrear,cpx:()=>cpAnular(D.id),pvn:nuevoProv,pvt:()=>toggleProv(D.id,D.v==='1'),pvc:()=>{S.provSel=D.id;render();window.scrollTo(0,0)},pvx:()=>{S.provSel=null;render()},pvp:()=>pvPagar(D.id),gxn:gxCrear,gxx:()=>gxAnular(D.id),csv:()=>exportar(D.v),rvn:nuevoRev,rvg:()=>guardarRev(D.id),rvt:()=>toggleRev(D.id,D.v==='1'),rvc:()=>{S.revSel=D.id;render();window.scrollTo(0,0)},rvx:()=>{S.revSel=null;render()},rvp:()=>revCobrar(D.id),rendok:()=>aprobarRendicion(D.id),ajuste:guardarAjuste,gprod:()=>guardarProducto(D.id),tprod:()=>toggleProducto(D.id,D.v==='1'),nprod:nuevoProducto,
    nmarca:nuevaMarca,tmarca:()=>toggleMarca(D.id,D.v==='1'),nubi:nuevaUbi,tubi:()=>toggleUbi(D.id,D.v==='1'),nusu:nuevoUsuario,tusu:()=>toggleUsuario(D.id,D.v==='1')};
  if(A[D.a])A[D.a]();
});
document.addEventListener('change',e=>{if(e.target.id==='vf'&&e.target.value){S.fecha=e.target.value;subVentas();e.target.blur();render()}});
document.addEventListener('focusout',()=>setTimeout(render,50));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))login()});
window.addEventListener('online',()=>{S.online=true;render()});window.addEventListener('offline',()=>{S.online=false;render()});
let taps=0,tapT;document.addEventListener('click',e=>{if(!e.target.closest('#logo'))return;taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,3000);if(taps>=5){taps=0;if(prompt('PIN')===ADMIN_PIN)alert('GasAR panel '+VERSION+'\nUsuario: '+(S.user?S.user.uid:'-')+'\nNegocio: '+(S.tid||'-')+'\nEn línea: '+S.online)}});
document.documentElement.dataset.theme=LS.get('tema','light');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw-gasar-admin.js').catch(()=>{}));
setTimeout(()=>{if(!S.user)hideSplash()},4000);
</script>
</body>
